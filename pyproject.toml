[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "alvarezgui"
version = "0.1.0"
description = "AlvarezGUI control plane and node agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "redis>=5,<6",
  "uvicorn>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alvarezgui"]

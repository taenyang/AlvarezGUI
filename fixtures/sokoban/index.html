<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sokoban</title>
<style>
  :root { color-scheme: light; }
  body { font: 18px sans-serif; margin: 18px; text-align: center; background: #f5f5f5; color: #18212b; }
  h1 { margin: 8px 0; font-size: 30px; }
  #board { display: inline-block; padding: 12px; margin: 8px 0; background: #d9e2ec; border-radius: 8px; font: 36px/1.1 monospace; letter-spacing: 2px; white-space: pre; }
  #status { min-height: 28px; margin: 6px; font-weight: bold; }
  #controls { display: grid; grid-template-columns: repeat(3, 84px); gap: 8px; justify-content: center; }
  button { font-size: 24px; min-height: 64px; touch-action: manipulation; }
  #reset { margin-top: 12px; font-size: 18px; min-height: 48px; }
  .complete { color: #176b2c; }
</style>
<h1>Sokoban</h1>
<pre id="board" aria-label="Sokoban board"></pre>
<p id="status">Push the box onto the goal.</p>
<div id="controls">
  <span></span><button aria-label="Up" onclick="move(-1, 0)">▲</button><span></span>
  <button aria-label="Left" onclick="move(0, -1)">◀</button><button aria-label="Down" onclick="move(1, 0)">▼</button><button aria-label="Right" onclick="move(0, 1)">▶</button>
</div>
<button id="reset" onclick="reset()">Reset</button>
<script>
const level = [
  "########",
  "# .    #",
  "# $    #",
  "#      #",
  "#      #",
  "########",
];
const board = document.getElementById("board");
const status = document.getElementById("status");
let player, box, complete;
function reset() { player = { row: 3, col: 4 }; box = { row: 2, col: 2 }; complete = false; status.className = ""; status.textContent = "Push the box onto the goal."; render(); }
function move(rowDelta, colDelta) {
  if (complete) return;
  const next = { row: player.row + rowDelta, col: player.col + colDelta };
  if (level[next.row][next.col] === "#") return;
  if (next.row === box.row && next.col === box.col) {
    const boxNext = { row: box.row + rowDelta, col: box.col + colDelta };
    if (level[boxNext.row][boxNext.col] === "#" || (boxNext.row === player.row && boxNext.col === player.col)) return;
    box = boxNext;
  }
  player = next;
  if (box.row === 1 && box.col === 2) {
    complete = true;
    status.className = "complete";
    status.textContent = "Sokoban complete";
  }
  render();
}
function render() {
  board.textContent = level.map((line, row) => [...line].map((cell, col) => {
    if (row === box.row && col === box.col) return row === 1 && col === 2 ? "*" : "$";
    if (row === player.row && col === player.col) return "@";
    return row === 1 && col === 2 ? "." : cell;
  }).join("")).join("\n");
}
document.addEventListener("keydown", (event) => {
  const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  if (moves[event.key]) { event.preventDefault(); move(...moves[event.key]); }
});
reset();
</script>
